name: todo-bot

on:
  schedule:
    - cron: "*/15 * * * *"   # check for Telegram commands; the 7am summary goes out on the first run after 7
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: todo-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CANVAS_BASE_URL: ${{ secrets.CANVAS_BASE_URL }}
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          TIMEZONE: ${{ vars.TIMEZONE || 'America/New_York' }}
          SUMMARY_TIME: ${{ vars.SUMMARY_TIME || '07:00' }}
        run: python -m todo_bot.main

      - name: Save encrypted state
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "todo-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/state.enc
            git commit -m "Update bot state [skip ci]"
            git push
          fi
